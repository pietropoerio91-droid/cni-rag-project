version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s:%(lineno)d - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/cni_rag.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8

loggers:
  cni_rag:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  cni_rag.ingestion:
    level: INFO
    handlers: [console, file]
    propagate: false
  cni_rag.api:
    level: INFO
    handlers: [console, file]
    propagate: false
  cni_rag.inference:
    level: INFO
    handlers: [console, file]
    propagate: false
  cni_rag.rag:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  httpx:
    level: WARNING
    handlers: [console]
    propagate: false
  urllib3:
    level: WARNING
    handlers: [console]
    propagate: false
  qdrant_client:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
