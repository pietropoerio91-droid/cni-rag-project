embedding:
  model_name: all-MiniLM-L6-v2
  device: cpu
  normalize_embeddings: true
  batch_size: 32

llm:
  provider: lm_studio
  base_url: http://localhost:1234/v1
  model: llama-3.2-3b-instruct
  temperature: 0.2
  max_tokens: 2048
  top_p: 0.95

chunking:
  chunk_size: 512
  chunk_overlap: 64
  separators:
    - "\n\n"
    - "\n"
    - "."
    - " "
    - ""

retrieval:
  top_k: 5
  score_threshold: 0.5
  hybrid_search:
    enabled: true
    dense_weight: 0.7
    sparse_weight: 0.3

reranking:
  enabled: true
  top_k: 3
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

vector_store:
  collection_name: cni_documents
  distance: cosine
  size: 384

crawler:
  base_url: https://www.cni.it
  max_depth: 5
  max_pages: 1000
  respect_robots_txt: true
  delay: 0.3
  timeout: 10
  allowed_domains:
    - www.cni.it
    - cni.it
  included_paths: []
  priority_paths:
    - /media-ing/news
    - /media-ing/comunicati-stampa
    - /media-ing/rassegna-stampa
    - /media-ing/
    - /cni
  priority_max_depth: 8
  max_links_per_page: 150

quality:
  min_content_length: 50
  max_content_length: 100000
  required_languages:
    - it
  max_repetition_ratio: 0.3
