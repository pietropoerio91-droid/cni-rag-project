embedding:
  model_name: paraphrase-multilingual-MiniLM-L12-v2
  device: cpu
  normalize_embeddings: true
  batch_size: 32

llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b
  temperature: 0.1
  max_tokens: 2048
  top_p: 0.95

chunking:
  chunk_size: 1500
  chunk_overlap: 200
  separators:
    - "\n\n"
    - "\n"
    - "."
    - " "
    - ""

retrieval:
  top_k: 25
  score_threshold: 0.3
  # Filtro rigido sulla categoria predetta dal classificatore.
  # Disattivato sulla base dell'ablation del 27/08: le sei categorie che il
  # classificatore non puo' produrre contengono il 75,8% dei chunk, quindi
  # ogni query classificata escludeva i tre quarti dell'indice.
  category_filter: false
  hybrid_search:
    # Recupero ibrido: ricerca densa e BM25 nella stessa collection Qdrant, fuse
    # con Reciprocal Rank Fusion. false = solo ricerca densa (misura il contributo
    # del canale lessicale).
    enabled: true
    rrf_k: 60
    dense_top_k: 50      # candidati per canale prima della fusione
    sparse_top_k: 50
    # Parametri BM25: si applicano alla COSTRUZIONE della collection
    # (scripts/build_sparse_collection.py). Cambiarli richiede di ricostruirla.
    bm25:
      k1: 1.2
      b: 0.75
      include_title: true   # il titolo entra nel testo indicizzato

reranking:
  enabled: true
  top_k: 5
  model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
  allow_fallback: false   # true = se il modello non si carica si risponde senza reranking

fallback:
  score_threshold: 0.5
  message: "Non ho trovato informazioni sufficienti nei documenti disponibili per rispondere a questa domanda. Prova a riformulare la domanda o chiedi un argomento diverso."

vector_store:
  collection_name: cni_documents_multiling_bm25
  distance: cosine
  size: 384

crawler:
  base_url: https://www.cni.it
  max_depth: 8
  max_pages: 15000
  focus_priority: true
  respect_robots_txt: true
  delay: 0.2
  timeout: 15
  allowed_domains:
    - www.cni.it
    - cni.it
  included_paths:
    - /media-ing
    - /cni
    - /temi
    - /contatti
    - /servizi
  priority_paths:
    - /media-ing/
    - /cni
    - /temi
    - /contatti
    - /servizi
  priority_max_depth: 12
  max_links_per_page: 300

quality:
  min_content_length: 50
  max_content_length: 100000
  required_languages:
    - it
  max_repetition_ratio: 0.65
