embedding:
  model_name: intfloat/multilingual-e5-small
  device: cpu
  normalize_embeddings: true
  batch_size: 32

llm:
  provider: ollama
  base_url: http://localhost:11434/v1
  model: qwen2.5:3b
  temperature: 0.1
  max_tokens: 2048
  top_p: 0.95

chunking:
  chunk_size: 1500
  chunk_overlap: 200
  separators:
    - "\n\n"
    - "\n"
    - "."
    - " "
    - ""

retrieval:
  top_k: 25
  score_threshold: 0.3
  # Filtro rigido sulla categoria predetta dal classificatore.
  # Disattivato sulla base dell'ablation del 27/08: le sei categorie che il
  # classificatore non puo' produrre contengono il 75,8% dei chunk, quindi
  # ogni query classificata escludeva i tre quarti dell'indice.
  category_filter: false
  hybrid_search:
    # Recupero ibrido: ricerca densa e BM25 nella stessa collection Qdrant, fuse
    # con Reciprocal Rank Fusion. false = solo ricerca densa (misura il contributo
    # del canale lessicale).
    enabled: true
    rrf_k: 60
    dense_top_k: 50      # candidati per canale prima della fusione
    sparse_top_k: 50
    # Parametri BM25: si applicano alla COSTRUZIONE della collection
    # (scripts/build_sparse_collection.py). Cambiarli richiede di ricostruirla.
    bm25:
      k1: 1.2
      b: 0.75
      include_title: true   # il titolo entra nel testo indicizzato

governance:
  pii_filter:
    # false: il corpus e' composto solo da pagine pubbliche, quindi mascherare email,
    # telefoni e codici non protegge nulla e blocca le risposte sui contatti dell'ente.
    # true: attivalo se il sistema tratta dati non pubblici.
    enabled: false
    masked: true

reranking:
  enabled: true
  top_k: 5
  model: BAAI/bge-reranker-base
  allow_fallback: false   # true = se il modello non si carica si risponde senza reranking
  # Peso della data fra i candidati valutati dal reranker (src/rag/recency.py):
  #   finale = (1 - w) * pertinenza + w * recenza
  # La recenza e' relativa ai candidati della domanda (il piu' vecchio 0, il piu'
  # recente 1; documenti senza data 0,5). 0 = ordine del solo reranker, come nella
  # tesi. Richiede un indice con le date (scripts/add_document_dates.py).
  recency_weight: 0.0

fallback:
  score_threshold: 0.5
  message: "Non ho trovato informazioni sufficienti nei documenti disponibili per rispondere a questa domanda. Prova a riformulare la domanda o chiedi un argomento diverso."

vector_store:
  collection_name: cni_documents_e5_bm25
  distance: cosine
  size: 384

crawler:
  base_url: https://www.cni.it
  max_depth: 8
  max_pages: 15000
  focus_priority: true
  respect_robots_txt: true
  delay: 0.2
  timeout: 15
  allowed_domains:
    - www.cni.it
    - cni.it
  included_paths:
    # --- percorsi originali, invariati ---
    - /media-ing
    - /cni
    - /temi
    - /contatti
    - /servizi

    # --- schede territoriali degli ordini provinciali ---
    # Non sono nel corpus attuale: la prima ingestione con questa voce produce un
    # corpus diverso da quello dei risultati gia' riportati.
    - /area-cni

    # --- percorsi gia' presenti nel corpus ma fuori dalla whitelist di prima ---
    # Senza queste voci una ingestione completa perderebbe il 36% degli URL
    # indicizzati (1.491 su 4.144).
    - /images                                   # PDF
    - /eventi
    - /sezioni-amministrazione-trasparente
    - /il-giornale-dell-ingegnere
    - /evidenza
    - /notizie-internazionali
    - /it/                                      # sezione internazionale in italiano
    - /faq                                      # non presente nel corpus attuale

    # Pagine istituzionali singole. Elenco esplicito: il crawler usa startswith e
    # un prefisso largo ammetterebbe pagine non verificate.
    - /albo-unico
    - /amministrazione-trasparente
    - /bonus-110-chiarimenti-commissione-csllpp
    - /euring
    - /ingegneri-biomedici-e-clinici
    - /ingegneri-e-rappresentanza
    - /ingegneri-in-italia
    - /network-cni
    - /note-legali
    - /nuovo-codice-deontologico-degli-ingegneri-italiani
    - /opportunita
    - /privacy-cookies
    - /pubblicazioni-cni
    - /regolamento-sugli-accessi
    - /rete-internazionale
    - /riconoscimento-qualifiche-in-italia
    - /urp
    - /whistleblowing

    # Esclusi di proposito, da non aggiungere:
    #   /en                              versione inglese (regola del crawler)
    #   /login-interno                   area riservata, fuori da un corpus di soli dati pubblici
    #   /gdl-formazione-universitaria    rimanda al login
    #   domini esterni                   fuori dal perimetro
  priority_paths:
    - /media-ing/
    - /cni
    - /temi
    - /contatti
    - /servizi
  priority_max_depth: 12
  max_links_per_page: 300

# Date di pubblicazione (src/ingestion/site_dates.py). Le pagine di cni.it non
# mostrano la data, la ricerca interna del sito si': si scarica una mappa
# URL -> data una volta per ingestione (circa 3 minuti) e la si salva su file.
dates:
  site_dates_file: data/dates/site_dates.json
  refresh_on_ingest: true      # POST /ingest aggiorna la mappa dopo il crawl
  search_delay: 0.5            # pausa fra le richieste alla ricerca del sito
  search_terms: [ingegneri, cni, consiglio, ingegneria, nazionale, presidente, ordine, professione]
  # La ricerca riporta la data di CREAZIONE della pagina. Vale come data di
  # pubblicazione solo per i contenuti che una volta pubblicati non cambiano
  # (notizie, comunicati, eventi). Le pagine istituzionali vengono aggiornate
  # senza cambiare data (/cni/consiglio risulta del 2016 ma mostra il Consiglio
  # attuale): restano senza data, cioe' neutre per la recenza.
  dated_sections:
    - /media-ing
    - /evidenza
    - /notizie-internazionali
    - /il-giornale-dell-ingegnere
    - /area-cni/200-elezioni-ordini-provinciali

quality:
  min_content_length: 50
  max_content_length: 100000
  required_languages:
    - it
  max_repetition_ratio: 0.65
