embedding:
  all-MiniLM-L6-v2:
    name: all-MiniLM-L6-v2
    dimension: 384
    max_seq_length: 256
    normalize: true
    provider: sentence_transformers

llm:
  lm_studio:
    name: llama-3.2-3b-instruct
    context_length: 8192
    endpoint: http://localhost:1234/v1
    api_key_env: LM_STUDIO_API_KEY
    parameters:
      temperature: 0.2
      max_tokens: 2048
      top_p: 0.95
      frequency_penalty: 0.0
      presence_penalty: 0.0
